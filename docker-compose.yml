services:
  postgres:
    image: postgres:16
    container_name: market_sentinel_postgres
    environment:
      POSTGRES_DB: market_sentinel
      POSTGRES_USER: ms_user
      POSTGRES_PASSWORD: ms_pass
    ports:
      - "5433:5432"
    volumes:
      - ms_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: market_sentinel_redis
    # Password-protected even locally: the cache holds serialized application
    # objects, so anyone able to write a key can influence what the app reads
    # back. Bound to loopback so it is not exposed beyond this machine.
    command: ["redis-server", "--requirepass", "ms_redis_pass"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  ms_pgdata:
