server:
  port: 8080

spring:
  application:
    name: SpringMarketAnalysis
  datasource:
    url: jdbc:postgresql://localhost:5433/market_sentinel
    username: ms_user
    password: ms_pass
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  # SMTP for alert emails. Leave MAIL_HOST unset to disable email delivery entirely
  # (the app still runs; alerts just won't be emailed). See EMAIL_SETUP.md.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
market:
  metrics:
    lookbackDays: 400
  prices:
    provider: stooq
  scheduler:
    enabled: true
    cron: "0 10 18 * * MON-FRI" # 6:10 PM weekdays
  alphavantage:
    apiKey: ${ALPHAVANTAGE_API_KEY:}
  alerts:
    webhook:
      url: ${ALERTS_WEBHOOK_URL:}          # Slack/Discord incoming webhook; blank = disabled
    email:
      to: ${ALERTS_EMAIL_TO:}              # recipient address; blank = disabled
      from: ${ALERTS_EMAIL_FROM:alerts@market-sentinel.local}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # Don't gate overall app health on SMTP reachability: email is an optional,
    # self-disabling delivery channel, so a missing/unreachable mail server must
    # not make /actuator/health report DOWN.
    mail:
      enabled: false
